name: Gitea Verify
on: [push]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System info
        run: |
          echo "Gitea Actions running on $(hostname)"
          echo "Repo: ${{ gitea.repository }}"
          echo "Commit: ${{ gitea.sha }}"
