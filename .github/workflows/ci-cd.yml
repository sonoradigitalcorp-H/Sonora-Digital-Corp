name: SDC CI/CD

on:
  push:
    branches: [next, main]
    tags: ['v*']
  pull_request:
    branches: [next]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -q ruff mypy pytest pyyaml
      - name: Ruff lint
        run: ruff check .
      - name: MyPy typecheck
        run: mypy --ignore-missing-imports 01_Core_Platform/ 03_Sandbox_and_RnD/
      - name: Guardian structure
        run: bash 00_Administration/guardians/structure_guard.sh

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -q pytest pytest-asyncio httpx pyyaml
      - name: Run tests
        run: |
          pytest 03_Sandbox_and_RnD/tests/integration/test_sdd0012_web_chat.py -v
          pytest 03_Sandbox_and_RnD/tests/integration/test_aztrotech_onboard.py -v 2>/dev/null || true

  eval-prompts:
    name: Eval Prompts (nemotron-free)
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q pyyaml
      - name: Run eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 01_Core_Platform/09_CICD_Pipelines/prompt_registry/run_eval.py
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json

  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Build & Push vps_ai_server
        uses: docker/build-push-action@v5
        with:
          context: 01_Core_Platform/04_Automations_and_Workflows
          file: Dockerfile.vps_ai_server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build & Push STT Server
        uses: docker/build-push-action@v5
        with:
          context: 01_Core_Platform/03_Agentic_Infrastructure/voice
          file: Dockerfile.stt
          push: true
          tags: ghcr.io/${{ github.repository }}/stt:${{ steps.meta.outputs.tags }}
      - name: Build & Push TTS Server
        uses: docker/build-push-action@v5
        with:
          context: 01_Core_Platform/03_Agentic_Infrastructure/voice
          file: Dockerfile.tts
          push: true
          tags: ghcr.io/${{ github.repository }}/tts:${{ steps.meta.outputs.tags }}

  deploy-vps:
    name: Deploy VPS HOSTINGER
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    steps:
      - name: Deploy to VPS Hostinger
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/sdc
            docker compose pull sdc-hermes 2>/dev/null || echo "no-hay-imagen-ghcr-pull-opcional"
            docker compose ps --services --filter "status=running" | grep -q sdc-hermes && echo "hermes-ok"
            curl -fsS http://localhost:8642/health || true
            echo "VPS Hostinger deploy OK"

  sync-engram:
    name: Sync Engram to VPS
    runs-on: ubuntu-latest
    needs: deploy-vps
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    steps:
      - name: Sync Engram
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: |
            echo "Engram vive en el VPS Hostinger /opt/sdc/hermes-data — no se sobrescribe desde CI."

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-vps, sync-engram]
    if: always()
    steps:
      - name: Notify result
        if: success()
        run: echo "SDC v${{ github.ref_name }} deployed to VPS HOSTINGER 45.90.108.12"
      - name: Notify failure
        if: failure()
        run: echo "SDC deploy failed"