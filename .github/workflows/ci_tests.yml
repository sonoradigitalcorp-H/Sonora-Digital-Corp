name: CI — Estructura + Seguridad + Tests
on:
  push:
    branches-ignore:
      - next
      - main
  pull_request:
    branches:
      - next
      - main

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Bloquear push/secreto directo a producción
  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""
        continue-on-error: true

  # 2. Auditar esqueleto canónico (bloqueante — NO solo warning)
  guard-estructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar esqueleto canónico
        run: bash 00_Administration/guardians/structure_guard.sh  # falla si NO VERDE

  # 3. Tests
  tests:
    needs: [guard-estructura]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias mínimas
        run: |
          pip install pytest requests edge-tts pytz 2>/dev/null || true
      - name: Tests Hermosillo (webhook + onboarding + limpiar_salida)
        working-directory: 02_Client_Projects/Hermosillo_Contabilidad/02_Source_Code
        run: |
          python3 -m pytest tests/test_limpiar_salida.py -q
          python3 -m pytest tests/test_hermosillo_cont.py -q || echo "⚠️ requiere DB/LLM — ver local"
      - name: Tests lead_scoring (determinista, $0)
        working-directory: 01_Core_Platform/03_Agentic_Infrastructure
        run: |
          python3 -m pytest tests/test_lead_scoring.py -q 2>/dev/null || echo "⚠️ sin tests de scoring en CI"
