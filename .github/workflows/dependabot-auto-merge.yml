name: "Dependabot Auto-Merge"

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.labels.*.name, 'dependencies')

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Enable auto-merge for safe updates"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Auto-merge only for patch/minor (safe) updates, not major
          PR_TITLE=$(gh pr view --json title -q .title "$PR_URL")
          echo "PR: $PR_TITLE"
          
          # If it's a security fix (dependabot security update), merge it
          if [[ "$PR_TITLE" != *"Bump"* && "$PR_TITLE" == *"security"* ]]; then
            echo "Security update detected — merging"
            gh pr merge --merge --auto "$PR_URL"
          elif [[ "$PR_TITLE" == *"Bump"* ]]; then
            # Check if it's patch/minor (safe)
            if ! echo "$PR_TITLE" | grep -qE "[0-9]+\.[0-9]+\.0"; then
              echo "Patch/minor update — auto-merging"
              gh pr merge --merge --auto "$PR_URL"
            else
              echo "Major version bump — leaving for manual review"
            fi
          fi