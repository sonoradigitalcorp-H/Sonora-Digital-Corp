name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check apps/ scripts/ --output-format=concise 2>&1 || true
          echo "✓ Lint completed"
