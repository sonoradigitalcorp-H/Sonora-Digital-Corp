server {
    listen 80;
    server_name sonoradigitalcorp.com www.sonoradigitalcorp.com NatContability.sonoradigitalcorp.com;

    root /var/www/sonoradigitalcorp;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Certbot acme challenge
    location /.well-known/acme-challenge/ {
        root /var/www/sonoradigitalcorp;
    }

    # Webhook Telegram de Hermosillo Contabilidad (Nathaly)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5291;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Assets de Hermosillo
    location /hermosillo_assets/ {
        alias /var/www/sonoradigitalcorp/hermosillo_assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy hacia VPS AI Server
    location /api/ {
        proxy_pass http://127.0.0.1:8643/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
