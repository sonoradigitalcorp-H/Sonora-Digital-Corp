# Mystic Brain — Visualización del Cerebro Digital
# Accesible en: http://149.56.46.173/brain/

location /brain/ {
    alias /home/ubuntu/sonora-digital-corp/docs/;
    index mystic-brain.html;
    
    # Ensure the main file is served
    try_files mystic-brain.html $uri $uri/ =404;
    
    # No caching — siempre la versión más reciente
    add_header Cache-Control 'no-cache, no-store, must-revalidate';
    add_header Access-Control-Allow-Origin '*';
    
    # CORS headers for CDN resources (three.js, d3.js)
    add_header Access-Control-Allow-Methods 'GET, OPTIONS';
    add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
}
