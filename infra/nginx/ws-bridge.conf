# ─── WebSocket Bridge — Chat + Audio en Tiempo Real ───
# Para incluir en /etc/nginx/sites-available/sonoradigitalcorp
# Agregar DENTRO del bloque server { ... }

    # WebSocket para Mystic Chat + Audio
    location /ws {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Audio endpoint para subir/descargar archivos de voz
    location /audio/ {
        proxy_pass http://127.0.0.1:8181/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }
