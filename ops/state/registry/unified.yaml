- id: acquire-metadata
  type: capability
  name: acquire-metadata
  domain: ''
  providers:
  - id: deezer-api
    contract_type: sdk
    weight: 1
    enabled: true
    cost_per_call: 0
    rate_limit: 50
    health_url: https://api.deezer.com/artist/0
    config:
      executor_module: scrapers.collectors.deezer
      timeout: 10
  - id: apple-music-api
    contract_type: sdk
    weight: 2
    enabled: true
    cost_per_call: 0
    rate_limit: 20
    health_url: null
    config:
      executor_module: scrapers.collectors.apple_music
      timeout: 10
  status: active
  source: config/registry.json
- id: search-artist
  type: capability
  name: search-artist
  domain: ''
  providers:
  - id: youtube-search
    contract_type: cli
    weight: 1
    enabled: true
    cost_per_call: 0
    rate_limit: 10
    health_url: null
    config:
      binary: yt-dlp
      args:
      - ytsearch5:{artist_name}
      - --skip-download
      - --no-warnings
      - --flat-playlist
      - --print-json
      timeout: 30
  - id: wikipedia-api
    contract_type: http
    weight: 2
    enabled: true
    cost_per_call: 0
    rate_limit: 100
    health_url: https://en.wikipedia.org/api/rest_v1/page/summary/Test
    config:
      base_url: https://en.wikipedia.org/api/rest_v1
      timeout: 10
  status: active
  source: config/registry.json
- id: browse-artist
  type: capability
  name: browse-artist
  domain: ''
  providers:
  - id: instagram-browser
    contract_type: browser
    weight: 1
    enabled: true
    cost_per_call: 0.001
    rate_limit: 3
    health_url: null
    config:
      url_template: https://www.instagram.com/{username}/
      timeout: 20
  - id: tiktok-browser
    contract_type: browser
    weight: 2
    enabled: true
    cost_per_call: 0.001
    rate_limit: 5
    health_url: null
    config:
      url_template: https://www.tiktok.com/@{username}
      timeout: 20
  - id: spotify-browser
    contract_type: browser
    weight: 3
    enabled: true
    cost_per_call: 0.001
    rate_limit: 5
    health_url: null
    config:
      url_template: https://open.spotify.com/artist/{artist_id}
      timeout: 20
  - id: facebook-browser
    contract_type: browser
    weight: 4
    enabled: false
    cost_per_call: 0.001
    rate_limit: 3
    health_url: null
    config:
      url_template: https://www.facebook.com/{username}
      timeout: 20
  status: active
  source: config/registry.json
