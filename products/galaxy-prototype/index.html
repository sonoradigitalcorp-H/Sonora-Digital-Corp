*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff}
#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#css3d-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
#css3d-container *{pointer-events:auto}

/* Top Bar */
#top-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(180deg,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0) 100%);pointer-events:auto}
#top-bar h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#00d4ff,#7b2fff,#ff006e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-transform:uppercase}
#top-bar .subtitle{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:1px}

/* Bottom Bar */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:linear-gradient(0deg,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0) 100%);pointer-events:auto}
#bottom-bar .tech-info{font-size:11px;color:rgba(255,255,255,0.4)}
#bottom-bar .voice-indicator{font-size:12px;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:8px}
#bottom-bar .voice-indicator span{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Connect Button */
#connect-btn{position:fixed;bottom:60px;right:24px;z-index:100;padding:12px 24px;background:linear-gradient(135deg,#7b2fff,#00d4ff);border:none;border-radius:30px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:all 0.3s;box-shadow:0 0 30px rgba(123,47,255,0.4)}
#connect-btn:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(123,47,255,0.7)}

/* Focus Panel */
#focus-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;background:rgba(10,10,30,0.95);border:1px solid rgba(123,47,255,0.4);border-radius:16px;padding:32px;max-width:500px;width:90%;display:none;backdrop-filter:blur(20px);box-shadow:0 0 60px rgba(123,47,255,0.3)}
#focus-panel.active{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#focus-panel h2{font-size:24px;margin-bottom:8px;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#focus-panel .role{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px}
#focus-panel .caps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#focus-panel .cap-tag{padding:4px 12px;background:rgba(123,47,255,0.15);border:1px solid rgba(123,47,255,0.3);border-radius:20px;font-size:11px;color:rgba(255,255,255,0.8)}
#focus-panel .close-btn{position:absolute;top:12px;right:16px;background:none;border:none;color:rgba(255,255,255,0.5);font-size:24px;cursor:pointer}
#focus-panel .close-btn:hover{color:#fff}

/* Galaxy Label */

.card-inner{position:relative;width:100%;height:100%;transition:transform 0.6s;transform-style:preserve-3d}

.card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;overflow:hidden}

.card-back .card-desc p{font-size:10px;line-height:1.5}

@keyframes textFade{0%,100%{opacity:0;transform:translateY(5px)}20%,80%{opacity:1;transform:translateY(0)}}

function createStarField() {
const starsCount = 15000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(starsCount * 3);
const colors = new Float32Array(starsCount * 3);
const sizes = new Float32Array(starsCount);

for (let i = 0; i < starsCount; i++) {
const radius = 200 + Math.random() * 800;
const theta = Math.random() * Math.PI * 2;
const phi = Math.acos(2 * Math.random() - 1);

positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
positions[i * 3 + 2] = radius * Math.cos(phi);

const temp = Math.random();
colors[i * 3] = 0.8 + temp * 0.2;
colors[i * 3 + 1] = 0.8 + temp * 0.1;
colors[i * 3 + 2] = 0.9 + temp * 0.1;

sizes[i] = 0.5 + Math.random() * 2;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const material = new THREE.PointsMaterial({
size: 1.5,
vertexColors: true,
transparent: true,
opacity: 0.8,
sizeAttenuation: true,
blending: THREE.AdditiveBlending
});

starField = new THREE.Points(geometry, material);
scene.add(starField);
}

function createGalaxy(agent) {
const group = new THREE.Group();
group.position.set(...agent.pos);

const particleCount = 8000;
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);
const randoms = new Float32Array(particleCount);

const r = agent.rgb[0] / 255;
const g = agent.rgb[1] / 255;
const b = agent.rgb[2] / 255;

const arms = 3;
const armSpread = 0.6;
const maxRadius = 12;

for (let i = 0; i < particleCount; i++) {
const arm = i % arms;
const t = Math.random();
const radius = t * maxRadius;
const angle = (arm / arms) * Math.PI * 2 + t * 2.5 + (Math.random() - 0.5) * armSpread;

const spiralX = Math.cos(angle) * radius;
const spiralZ = Math.sin(angle) * radius;

const spread = (1 - t * 0.7) * 2;
const x = spiralX + (Math.random() - 0.5) * spread;
const y = (Math.random() - 0.5) * spread * 0.3;
const z = spiralZ + (Math.random() - 0.5) * spread;

positions[i * 3] = x;
positions[i * 3 + 1] = y;
positions[i * 3 + 2] = z;

const brightness = 0.5 + Math.random() * 0.5;
const mixFactor = Math.random() * 0.3;
colors[i * 3] = Math.min(1, r * brightness + mixFactor);
colors[i * 3 + 1] = Math.min(1, g * brightness + mixFactor * 0.5);
colors[i * 3 + 2] = Math.min(1, b * brightness + mixFactor * 0.7);

sizes[i] = 0.3 + Math.random() * 1.2 * (1 - t * 0.5);
randoms[i] = Math.random();
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

const vertexShader = `
attribute float size;
attribute float aRandom;
varying vec3 vColor;
varying float vRandom;
void main() {
vColor = color;
vRandom = aRandom;
vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
gl_PointSize = size * (200.0 / -mvPosition.z);
gl_Position = projectionMatrix * mvPosition;
}
`;

const fragmentShader = `
varying vec3 vColor;
varying float vRandom;
void main() {
float d = length(gl_PointCoord - vec2(0.5));
if (d > 0.5) discard;
float alpha = 1.0 - smoothstep(0.0, 0.5, d);
alpha *= 0.8 + vRandom * 0.2;
gl_FragColor = vec4(vColor, alpha);
}
`;

const material = new THREE.ShaderMaterial({
vertexShader,
fragmentShader,
vertexColors: true,
transparent: true,
blending: THREE.AdditiveBlending,
depthWrite: false
});

const particles = new THREE.Points(geometry, material);
group.add(particles);

const coreGeometry = new THREE.SphereGeometry(0.8, 32, 32);
const coreMaterial = new THREE.MeshBasicMaterial({
color: new THREE.Color(agent.color),
transparent: true,
opacity: 0.6
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
group.add(core);

const glowGeometry = new THREE.SphereGeometry(1.5, 32, 32);
const glowMaterial = new THREE.MeshBasicMaterial({
color: new THREE.Color(agent.color),
transparent: true,
opacity: 0.15,
side: THREE.BackSide
});
const glow = new THREE.Mesh(glowGeometry, glowMaterial);
group.add(glow);

const ringGeo = new THREE.RingGeometry(1.8, 2.2, 64);
const ringMat = new THREE.MeshBasicMaterial({
color: new THREE.Color(agent.color),
transparent: true,
opacity: 0.2,
side: THREE.DoubleSide
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
group.add(ring);

scene.add(group);

return {
group,
particles,
core,
glow,
ring,
agent,
orbitAngle: Math.random() * Math.PI * 2,
baseRotation: 0.0003 + Math.random() * 0.0003
};
}

const div = document.createElement('div');
div.className = 'orbital-card';
div.style.setProperty('--card-color', agent.color);
div.style.setProperty('--card-rgb', agent.rgb.join(','));

const statsHTML = card.stats
? Object.entries(card.stats).map(([k, v]) => `<div class="card-stat"><div class="val">${v}</div><div class="lbl">${k}</div></div>`).join('')
: card.stats.map(s => `<div class="card-stat"><div class="val">${s}</div></div>`).join('');

div.innerHTML = `
<div class="card-inner">
<div class="card-front">
<div class="card-icon">${card.icon}</div>
<div class="card-title">${card.title}</div>
<div class="card-divider"></div>
<div class="card-desc">${card.desc}</div>
<div class="animated-text" style="animation-delay:${index * 0.5}s">[${agent.name.toUpperCase()}]</div>
<div class="card-stats">${statsHTML}</div>
</div>
<div class="card-back">
<div style="padding:16px;text-align:center">
<div style="font-size:32px;margin-bottom:12px">${card.icon}</div>
<h4 style="color:${agent.color};margin-bottom:8px">${card.title}</h4>
<p style="font-size:10px;color:rgba(255,255,255,0.7);line-height:1.5">${card.desc}</p>
<div style="margin-top:16px;padding-top:12px;border-top:1px solid ${agent.color}40">
<div style="font-size:9px;color:${agent.color};text-transform:uppercase;letter-spacing:1px">Powered by</div>
<div style="font-size:10px;color:rgba(255,255,255,0.5);margin-top:4px">Sonora Digital Corp</div>
</div>
</div>
</div>
</div>
`;

div.addEventListener('click', (e) => {
e.stopPropagation();
showFocusPanel(agent);
});

return div;
}

function createCards(galaxy) {
const { agent } = galaxy;
const cards = cardData[agent.id] || [];

cards.forEach((card, i) => {
const div = createCardElement(card, agent, i);
const cssObject = new CSS3DObject(div);

const orbitRadius = 18 + i * 6;
const orbitSpeed = 0.1 + Math.random() * 0.15;
const orbitTilt = (Math.random() - 0.5) * 0.5;

cssObject.position.set(
Math.cos(i * Math.PI * 2 / cards.length) * orbitRadius,
orbitTilt * 5,
Math.sin(i * Math.PI * 2 / cards.length) * orbitRadius
);

scene.add(cssObject);
cardObjects.push({
object: cssObject,
div,
agentId: agent.id,
orbitRadius,
orbitSpeed,
orbitTilt,
baseAngle: i * Math.PI * 2 / cards.length,
visible: true
});
});
}

function createLabels() {
agents.forEach(agent => {
const div = document.createElement('div');
div.className = 'galaxy-label';
div.style.color = agent.color;
div.textContent = agent.name.toUpperCase();

const cssObject = new CSS3DObject(div);
cssObject.position.set(agent.pos[0], agent.pos[1] + 16, agent.pos[2]);
cssObject.scale.set(0.08, 0.08, 0.08);

scene.add(cssObject);
labelSprites.push({ object: cssObject, agent });
});
}

function setupPostProcessing() {
composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
new THREE.Vector2(window.innerWidth, window.innerHeight),
0.8,
0.4,
0.85
);
composer.addPass(bloomPass);
}

function setupInteraction() {
renderer.domElement.addEventListener('click', onCanvasClick);
document.querySelector('.close-btn').addEventListener('click', closeFocusPanel);
document.getElementById('connect-btn').addEventListener('click', () => {
alert('QR Code placeholder — Integration coming soon!');
});
}

function onCanvasClick(event) {
const rect = renderer.domElement.getBoundingClientRect();
const mouse = new THREE.Vector2(
((event.clientX - rect.left) / rect.width) * 2 - 1,
-((event.clientY - rect.top) / rect.height) * 2 + 1
);

const raycaster = new THREE.Raycaster();
raycaster.setFromCamera(mouse, camera);

for (const galaxy of galaxies) {
const intersects = raycaster.intersectObject(galaxy.core);
if (intersects.length > 0) {
focusOnAgent(galaxy.agent);
return;
}
}
}

function focusOnAgent(agent) {
focusedAgent = agent;
controls.autoRotate = false;

const pos = agent.pos;
targetCameraPos = new THREE.Vector3(pos[0] + 15, pos[1] + 10, pos[2] + 15);
targetLookAt = new THREE.Vector3(...pos);

showFocusPanel(agent);
}

function showFocusPanel(agent) {
const panel = document.getElementById('focus-panel');
panel.style.setProperty('--accent1', agent.color);
panel.style.setProperty('--accent2', agent.color);

document.getElementById('fp-title').textContent = agent.name;
document.getElementById('fp-title').style.background = `linear-gradient(135deg, ${agent.color}, #ffffff)`;
document.getElementById('fp-title').style.webkitBackgroundClip = 'text';
document.getElementById('fp-title').style.webkitTextFillColor = 'transparent';

document.getElementById('fp-role').textContent = agent.role;
document.getElementById('fp-details').textContent = agent.desc;

const capsContainer = document.getElementById('fp-caps');
capsContainer.innerHTML = agent.caps.map(c => `<span class="cap-tag">${c}</span>`).join('');

panel.classList.add('active');
}

function closeFocusPanel() {
document.getElementById('focus-panel').classList.remove('active');
focusedAgent = null;
controls.autoRotate = true;
targetCameraPos = new THREE.Vector3(0, 40, 80);
targetLookAt = new THREE.Vector3(0, 0, 0);
}

function onResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
cssRenderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
requestAnimationFrame(animate);

const elapsed = clock.getElapsedTime();
const delta = clock.getDelta();

galaxies.forEach((galaxy, i) => {
galaxy.particles.rotation.y += galaxy.baseRotation;
galaxy.core.rotation.y += 0.005;
galaxy.glow.scale.setScalar(1 + Math.sin(elapsed * 2 + i) * 0.1);
galaxy.ring.rotation.z += 0.002;
});

starField.rotation.y += 0.0001;

cardObjects.forEach((card, i) => {
const angle = card.baseAngle + elapsed * card.orbitSpeed;
const galaxy = galaxies.find(g => g.agent.id === card.agentId);
if (!galaxy) return;

const pos = galaxy.group.position;
card.object.position.set(
pos.x + Math.cos(angle) * card.orbitRadius,
pos.y + card.orbitTilt * 5 + Math.sin(elapsed * 0.5 + i) * 2,
pos.z + Math.sin(angle) * card.orbitRadius
);

card.object.lookAt(camera.position);
});

labelSprites.forEach(label => {
label.object.lookAt(camera.position);
});

if (targetCameraPos) {
camera.position.lerp(targetCameraPos, 0.03);
if (camera.position.distanceTo(targetCameraPos) < 0.5) {
targetCameraPos = null;
}
}

if (targetLookAt) {
controls.target.lerp(targetLookAt, 0.03);
if (controls.target.distanceTo(targetLookAt) < 0.5) {
targetLookAt = null;
}
}

controls.update();
composer.render();
cssRenderer.render(scene, camera);
}

init();
</script>
</body>
</html>
