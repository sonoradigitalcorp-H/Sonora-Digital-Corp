<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b141a; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .stage {
    width: 420px; height: 880px; margin: 0 auto;
    background: #0b141a;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .statusbar { background: #0b141a; color: #e5e7eb; font-size: 14px; padding: 10px 22px 4px; display: flex; justify-content: space-between; }
  .chat-header { background: #202c33; color: #e5e7eb; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#22d3ee,#a855f7); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #0f172a; }
  .h-name { font-weight: 700; font-size: 16px; }
  .h-sub { font-size: 12px; color: #8696a0; }
  .h-icons { margin-left: auto; color: #8696a0; font-size: 16px; letter-spacing: 5px; }
  .body { flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; }
  .date-chip { align-self: center; background: #182229; color: #8696a0; font-size: 11.5px; padding: 5px 12px; border-radius: 8px; }
  .msg { max-width: 84%; padding: 9px 11px; border-radius: 12px; font-size: 14px; line-height: 1.45; position: relative; opacity: 0; transform: translateY(12px); animation: pop 0.3s forwards; }
  @keyframes pop { to { opacity: 1; transform: translateY(0); } }
  .msg.them { background: #202c33; color: #e9edef; align-self: flex-start; border-top-left-radius: 4px; }
  .msg.me { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 4px; }
  .msg .time { display: block; text-align: right; font-size: 10px; color: #8696a0; margin-top: 4px; }
  .msg.me .time { color: #7fb9a8; }
  .msg .b { font-weight: 700; color: #f8fafc; }
  .msg.them .b { color: #67e8f9; }
  .row { display: flex; justify-content: space-between; gap: 14px; }
  .k { color: #8696a0; }
  .v { font-weight: 600; color: #f8fafc; }
  .v.good { color: #4ade80; }
  .v.bad { color: #f87171; }
  .v.warn { color: #facc15; }
  .typing { align-self: flex-start; background: #202c33; border-radius: 12px; border-top-left-radius: 4px; padding: 11px 14px; display: flex; gap: 5px; }
  .typing span { width: 8px; height: 8px; background: #8696a0; border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  .input-bar { background: #202c33; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .input-dummy { flex: 1; background: #2a3942; border-radius: 24px; height: 36px; display: flex; align-items: center; padding: 0 14px; color: #8696a0; font-size: 13.5px; }
  .mic { color: #8696a0; font-size: 18px; }
  .send { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; color: #0b141a; font-size: 16px; }
  .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 60px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="stage">
  <div class="statusbar"><span>06:32</span><span>📶 🔋</span></div>
  <div class="chat-header">
    <div class="avatar">M</div>
    <div><div class="h-name">Mystic</div><div class="h-sub">en línea · tu asistente</div></div>
    <div class="h-icons">📞 📷</div>
  </div>
  <div class="body" id="body">
    <div class="date-chip">Hoy · 06:32</div>
  </div>
  <div class="input-bar"><div class="input-dummy">Mensaje</div><div class="mic">🎤</div><div class="send">➤</div></div>
  <div class="vignette"></div>
</div>

<script>
const body = document.getElementById('body');
let idx = 0;
const NO_TYPING = Symbol();

function addTyping() {
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(t);
  body.scrollTop = body.scrollHeight;
  return t;
}
function addMsg(cls, html) {
  const m = document.createElement('div');
  m.className = 'msg ' + cls;
  m.innerHTML = html;
  body.appendChild(m);
  body.scrollTop = body.scrollHeight;
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// story: index, then [them|me|none], html, displayMs, typingMs
const story = [
  [0, 'them', '<b>Buenos días Alex.</b> Ya revisé el turno nocturno y la línea 2 sigue estable. Te paso el resumen antes de tu junta.', 3400, 1500],
  [1, 'none', '📊', 100, 0],
  [2, 'them', '<b>📊 Shift Report · Noche</b><div style="margin-top:7px"><div class="row"><span class="k">Unidades</span><span class="v">398 / 420</span></div><div class="row"><span class="k">OEE</span><span class="v good">82%</span></div><div class="row"><span class="k">Paros</span><span class="v bad">1 (18 min)</span></div><div class="row"><span class="k">Calidad</span><span class="v good">99.4%</span></div></div>', 3800, 0],
  [3, 'none', '🚨', 100, 0],
  [4, 'them', '🚨 <b>Alerta predictiva · Fanuc L2.</b> Bearing del joint 4 con desgaste temprano. Corriente +8% sobre baseline.', 4000, 1800],
  [5, 'them', 'Pronóstico: falla en <b>~3 días</b>. Recomiendo cambiarlo en el paro planeado del sábado.', 3800, 1200],
  [6, 'me', '¿Cuánto me cuesta si truena vs si lo cambio programado?', 3000, 0],
  [7, 'them', 'Si truena: ~4 hrs de paro ≈ <b>$5–9M USD</b>. Programado: repuesto + 2 hrs. <b>Ahorro: $4–8M USD.</b>', 4500, 1800],
  [8, 'me', 'Va, genera la OT 👌', 2500, 0],
  [9, 'them', '✅ <b>OT-1047 creada</b> y en cola para firma. Avisé a mantenimiento para el sábado.', 3500, 1500],
  [10, 'none', '📈', 100, 0],
  [11, 'them', '📈 <b>OEE en vivo</b> · L1 84% · L2 71% ⚠️. Causa de L2: micro-paros del robot de pintura (6 eventos, 21 min). Cuello de botella del día.', 5000, 1500],
  [12, 'me', 'Para la junta de las 9:30, hazme el pareto de paros de la semana', 3300, 0],
  [13, 'them', 'Listo 🫡 Te mando el pareto en PDF con causa raíz de cada paro y el top 3 a atacar.', 3600, 1800],
  [14, 'them', 'Ese es tu día conmigo, Alex: <b>reportes, predictivo, minutas y dashboards</b> — todo en tiempo real, sin andar persiguiendo datos.', 5200, 1500],
];

async function run() {
  for (const [i, who, html, dur, typing] of story) {
    if (typing) {
      const t = addTyping();
      await wait(typing);
      t.remove();
    }
    addMsg(who === 'me' ? 'me' : who === 'them' ? 'them' : 'them', html);
    await wait(dur);
  }
}
run();
</script>
</body>
</html>
