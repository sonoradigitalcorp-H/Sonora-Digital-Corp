[project]
name = "sdd"
version = "0.1.0"
description = "SDC Spec-Driven Development CLI"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-bdd>=7.0",
    "click>=8.0",
]

[project.scripts]
sdd = "sdd.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sdd"]
