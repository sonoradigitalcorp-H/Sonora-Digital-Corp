<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AztroTech AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --copper:#AC6D3E;--copper-light:#CD8D5D;
  --sage:#B6C08B;--sage-light:#D0D8AE;
  --bg:#0a0e17;--bg-card:#111827;
  --text:#e8edf5;--text-muted:rgba(232,237,245,0.3);
  --border:rgba(172,109,62,0.15);
}
body{
  font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);
  height:100vh;display:flex;flex-direction:column;
}
/* ===== HEADER ===== */
header{
  display:flex;align-items:center;gap:14px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:var(--bg-card);
}
.logo{width:36px;height:36px;border-radius:10px;background:var(--copper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
header h1{font-size:17px;font-weight:600}
header span{color:var(--copper-light);font-weight:300}
header .badge{margin-left:auto;font-size:10px;padding:4px 10px;border-radius:12px;background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.2)}
/* ===== CHAT ===== */
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chat:empty::after{content:'🚀 ¿En qué puedo ayudarte hoy?';display:block;text-align:center;color:var(--text-muted);padding:60px 20px;font-size:14px;font-weight:300}
.msg{display:flex;gap:10px;max-width:88%;animation:pop 0.25s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg.bot{margin-right:auto}
.av{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;
}
.msg.user .av{background:var(--copper);color:#fff;order:1}
.msg.bot .av{background:var(--sage);color:var(--bg);font-weight:700}
.bubble{
  padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;
}
.msg.user .bubble{background:var(--copper);color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble{background:var(--bg-card);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble strong{color:var(--copper-light)}
/* ===== TYPING ===== */
.typing{display:none;gap:8px;padding:4px 0;margin-right:auto}
.typing.show{display:flex}
.typing .dots{display:flex;gap:3px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:4px}
.typing .dots span{width:7px;height:7px;border-radius:50%;background:var(--copper-light);animation:bounce 1.4s infinite}
.typing .dots span:nth-child(2){animation-delay:-0.16s}
.typing .dots span:nth-child(3){animation-delay:-0.32s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
/* ===== INPUT ===== */
footer{
  padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-card);
}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{
  flex:1;background:transparent;border:none;color:var(--text);
  font-family:'Poppins',sans-serif;font-size:13.5px;resize:none;outline:none;
  padding:8px 0;max-height:100px;line-height:1.5;
}
textarea::placeholder{color:var(--text-muted)}
button{
  width:38px;height:38px;border-radius:50%;border:none;
  background:var(--copper);color:#fff;font-size:16px;cursor:pointer;transition:0.2s;flex-shrink:0;
}
button:hover{background:var(--copper-light);transform:scale(1.05)}
button:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{
  padding:4px 12px;border-radius:14px;border:1px solid var(--border);
  background:transparent;color:var(--text-muted);font-size:11px;font-family:'Poppins',sans-serif;
  cursor:pointer;transition:0.2s;
}
.chip:hover{border-color:var(--copper);color:var(--copper-light);background:rgba(172,109,62,0.08)}
</style>
</head>
<body>
<header>
  <div class="logo">✦</div>
  <h1>AztroTech <span>AI</span></h1>
  <div class="badge">✦ En línea</div>
</header>
<div class="chat" id="chat"></div>
<footer>
  <div class="chips" id="chips">
    <button class="chip" onclick="ask('¿Qué es AztroTech?')">¿Qué es?</button>
    <button class="chip" onclick="ask('Servicios')">Servicios</button>
    <button class="chip" onclick="ask('Precios')">Precios</button>
    <button class="chip" onclick="ask('Contacto')">Contacto</button>
  </div>
  <div class="input-row">
    <textarea id="inp" rows="1" placeholder="Escribe tu mensaje..." onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="btn" onclick="send()">➤</button>
  </div>
  <div class="typing" id="typing"><div class="dots"><span></span><span></span><span></span></div></div>
</footer>
<script>
const API = window.location.origin+'/api/chat';
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
const btn=document.getElementById('btn');
const typ=document.getElementById('typing');

inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px'});

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}

function add(role,text){
  const d=document.createElement('div');d.className='msg '+role;
  const t=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=`<div class="av">${role=='user'?'👤':'✦'}</div><div><div class="bubble">${esc(text)}</div><div style="font-size:9px;color:var(--text-muted);margin-top:2px;text-align:${role=='user'?'right':'left'}">${t}</div></div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}

function ask(t){inp.value=t;send()}

async function send(){
  const t=inp.value.trim();if(!t)return;
  inp.value='';inp.style.height='auto';btn.disabled=true;
  add('user',t);typ.classList.add('show');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      messages:[{role:'system',content:'Eres el asistente IA de AztroTech, firma fundada por César Holguín en Hermosillo, Sonora. Hablas español con tono preciso, estratégico y cercano. Ofreces: agentes IA (Starter $19, Pro $49, Enterprise $99/mes), Call Agent ($299-$1,999/mes), Content Engine ($199-$1,299/mes), Clon Digital (desde $1,500). Nunca digas que eres de SDC.'},
      {role:'user',content:t}],model:'deepseek/deepseek-chat'}});
    const d=await r.json();
    add('bot',d?.choices?.[0]?.message?.content||'Lo siento, no pude procesar tu consulta.');
  }catch(e){add('bot','⚠️ Error de conexión. Intenta de nuevo.')}
  finally{typ.classList.remove('show');btn.disabled=false;inp.focus()}
}
</script>
</body>
</html>
