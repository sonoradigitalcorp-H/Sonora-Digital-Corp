<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AztroTech Grimoire — 3D Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--copper:#AC6D3E;--copper-light:#CD8D5D;--copper-glow:rgba(172,109,62,0.3);--sage:#B6C08B;--sage-light:#D0D8AE;--bg:#08090f;--bg-card:rgba(17,23,40,0.85);--text:#e8edf5;--text-muted:rgba(232,237,245,0.35);--border:rgba(172,109,62,0.12);--font:'Poppins',sans-serif}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}
#three-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* ===== HEADER ===== */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;background:linear-gradient(180deg,rgba(8,9,15,0.98),transparent);
  height:48px;
}
.header-left{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--copper),var(--copper-light));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.header h1{font-size:14px;font-weight:600}
.header span{font-weight:300;color:var(--copper-light)}
.header-right{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--text-muted)}
.header-right .dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:3px}
.dot.green{background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ===== FLOATING PANELS (draggable) ===== */
.panel{
  position:absolute;z-index:50;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;backdrop-filter:blur(20px);
  display:flex;flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
  min-width:200px;min-height:60px;
  cursor:grab;transition:box-shadow 0.3s;
}
.panel:active{cursor:grabbing}
.panel:hover{box-shadow:0 8px 48px rgba(172,109,62,0.15)}
.panel-header{
  padding:8px 12px;border-bottom:1px solid var(--border);
  font-size:10px;font-weight:600;color:var(--copper-light);
  display:flex;justify-content:space-between;align-items:center;
  cursor:grab;user-select:none;letter-spacing:0.5px;
  min-height:32px;
}
.panel-header:active{cursor:grabbing}
.panel-close{
  width:18px;height:18px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.05);color:var(--text-muted);
  font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.panel-close:hover{background:rgba(239,68,68,0.2);color:#ef4444}
.panel-body{padding:10px 12px;flex:1;overflow:auto;cursor:auto;font-size:12px;line-height:1.5}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Chat panel */
#chatPanel{width:340px;height:420px;top:60px;right:20px}
.chat-msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.chat-msgs:empty::after{content:'🚀 ¿En qué te ayudo?';display:block;text-align:center;color:var(--text-muted);padding:30px 10px;font-size:11px;font-weight:300}
.msg{display:flex;gap:6px;max-width:90%;animation:pop 0.2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg.bot{margin-right:auto}
.msg .av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;margin-top:1px}
.msg.user .av{background:var(--copper);color:#fff;order:1}
.msg.bot .av{background:var(--sage);color:var(--bg);font-weight:700}
.msg .bubble{padding:6px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;word-wrap:break-word}
.msg.user .bubble{background:var(--copper);color:#fff;border-bottom-right-radius:2px}
.msg.bot .bubble{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-bottom-left-radius:2px}
.msg .bubble strong{color:var(--copper-light)}
.chat-input{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--border);align-items:center}
.chat-input input{
  flex:1;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-family:var(--font);font-size:11px;padding:6px 10px;outline:none;
}
.chat-input input::placeholder{color:var(--text-muted)}
.chat-input button{
  width:28px;height:28px;border-radius:50%;border:none;flex-shrink:0;
  background:var(--copper);color:#fff;font-size:12px;cursor:pointer;transition:0.2s;
  display:flex;align-items:center;justify-content:center;
}
.chat-input button:hover{background:var(--copper-light)}
.chat-input .mic-btn{background:transparent;border:1px solid var(--border);font-size:13px;color:var(--text-muted)}
.chat-input .mic-btn:hover{border-color:var(--copper);color:var(--copper-light)}
.chat-input .mic-btn.active{background:rgba(16,185,129,0.15);border-color:#10b981;color:#10b981;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)}50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}}

/* Tasks panel */
#tasksPanel{width:300px;height:260px;top:60px;left:20px}
.task-item{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  border-radius:6px;transition:0.2s;cursor:pointer;font-size:11px;
}
.task-item:hover{background:rgba(172,109,62,0.08)}
.task-item .check{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px}
.task-item.done .check{background:#10b981;border-color:#10b981}
.task-item.done{opacity:0.5;text-decoration:line-through}
.task-item .tag{font-size:8px;padding:1px 6px;border-radius:6px;margin-left:auto;flex-shrink:0}
.tag.urgent{background:rgba(239,68,68,0.15);color:#ef4444}
.tag.normal{background:rgba(16,185,129,0.15);color:#10b981}
.tag.future{background:rgba(172,109,62,0.15);color:var(--copper-light)}

/* Dashboard panel */
#dashPanel{width:280px;height:180px;bottom:80px;right:20px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dash-item{
  text-align:center;padding:8px;border-radius:6px;background:rgba(255,255,255,0.02);
}
.dash-item .val{font-size:16px;font-weight:700;color:var(--copper-light)}
.dash-item .lbl{font-size:8px;color:var(--text-muted);margin-top:1px;letter-spacing:0.5px}

/* Network panel */
#networkPanel{width:220px;height:140px;bottom:80px;left:20px}
.network-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;transition:0.2s;font-size:11px}
.network-item:hover{background:rgba(172,109,62,0.08)}
.network-item .icon{font-size:14px}
.network-item .status{width:6px;height:6px;border-radius:50%;margin-left:auto}
.network-item .status.on{background:#10b981}

/* ===== STATUS BAR ===== */
.status-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:4px 20px;display:flex;justify-content:space-between;
  font-size:7px;color:var(--text-muted);letter-spacing:0.5px;
  background:linear-gradient(0deg,rgba(8,9,15,0.95),transparent);
  height:24px;align-items:center;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  #chatPanel{width:calc(100vw-24px);height:50vh;top:52px;right:12px;left:12px}
  #tasksPanel{width:calc(50vw-24px);height:160px;top:52px;left:12px}
  #dashPanel{width:calc(50vw-24px);height:140px;bottom:36px;right:12px}
  #networkPanel{width:calc(50vw-24px);height:120px;bottom:36px;left:12px}
}
</style>
</head>
<body>
<div id="three-canvas"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="logo">✦</div>
    <h1>AztroTech <span>Grimoire</span></h1>
  </div>
  <div class="header-right">
    <span><span class="dot green"></span>Engram</span>
    <span id="memCounter">0 memorias</span>
    <span id="sessTimer">00:00</span>
  </div>
</div>

<!-- CHAT PANEL -->
<div class="panel" id="chatPanel" style="top:56px;right:16px">
  <div class="panel-header">
    <span>💬 Mystic AI · Voz</span>
    <button class="panel-close" onclick="this.parentElement.parentElement.style.display='none'">✕</button>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input">
    <button class="mic-btn" id="micToggle" onclick="toggleMic()">🎤</button>
    <input id="chatInput" placeholder="Escribe o habla..." onkeydown="if(event.key=='Enter')sendChat()">
    <button onclick="sendChat()">➤</button>
  </div>
</div>

<!-- TASKS PANEL -->
<div class="panel" id="tasksPanel" style="top:56px;left:16px">
  <div class="panel-header">
    <span>📋 Tareas sugeridas</span>
    <button class="panel-close" onclick="this.parentElement.parentElement.style.display='none'">✕</button>
  </div>
  <div class="panel-body" id="tasksBody"></div>
</div>

<!-- DASHBOARD PANEL -->
<div class="panel" id="dashPanel" style="bottom:36px;right:16px">
  <div class="panel-header">
    <span>📊 Dashboard</span>
    <button class="panel-close" onclick="this.parentElement.parentElement.style.display='none'">✕</button>
  </div>
  <div class="panel-body">
    <div class="dash-grid">
      <div class="dash-item"><div class="val" id="dashCalls">0</div><div class="lbl">Llamadas</div></div>
      <div class="dash-item"><div class="val" id="dashLeads">0</div><div class="lbl">Leads</div></div>
      <div class="dash-item"><div class="val" id="dashTokens">0</div><div class="lbl">Tokens hoy</div></div>
      <div class="dash-item"><div class="val" id="dashCost">$0</div><div class="lbl">Costo</div></div>
    </div>
  </div>
</div>

<!-- NETWORK PANEL -->
<div class="panel" id="networkPanel" style="bottom:36px;left:16px">
  <div class="panel-header">
    <span>🌐 Redes</span>
    <button class="panel-close" onclick="this.parentElement.parentElement.style.display='none'">✕</button>
  </div>
  <div class="panel-body" id="networkBody"></div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span><span class="dot green"></span> Engram 7 capas · Qdrant · Neo4j</span>
  <span>✦ AztroTech — Espiritualidad con Estructura</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================================================================
// THREE.JS — Grimoire 3D Interactive Scene
// ================================================================
const container = document.getElementById('three-canvas');
const C = { copper:0xAC6D3E, copperLight:0xCD8D5D, sage:0xB6C08B, sageLight:0xD0D8AE };

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08090f, 0.001);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 20);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x08090f, 0);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x222244, 0.4));
const dl = new THREE.DirectionalLight(0xffeedd, 0.6); dl.position.set(1,1,1); scene.add(dl);
const bl = new THREE.DirectionalLight(0x4444ff, 0.2); bl.position.set(-1,-1,-1); scene.add(bl);

// ---- Infinity Symbol ----
const g = new THREE.Group(); scene.add(g);
const pts = [];
for (let i = 0; i <= 400; i++) {
  const t = (i/400)*Math.PI*2, s = 5.5;
  pts.push(new THREE.Vector3(s*Math.cos(t)/(1+Math.sin(t)**2), s*Math.sin(t)*Math.cos(t)/(1+Math.sin(t)**2), Math.sin(t*2)*0.8));
}
const curve = new THREE.CatmullRomCurve3(pts, true);
g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 200, 0.06, 8, true), new THREE.MeshBasicMaterial({color:C.copper,transparent:true,opacity:0.1,wireframe:true})));
g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 100, 0.18, 16, true), new THREE.MeshBasicMaterial({color:C.copperLight,transparent:true,opacity:0.03,side:THREE.DoubleSide})));

// Particles along infinity
const pc = 800; const pp = new Float32Array(pc*3);
for (let i = 0; i < pc; i++) {
  const t = (i/pc)*Math.PI*2, s = 5.5;
  pp[i*3]=s*Math.cos(t)/(1+Math.sin(t)**2);pp[i*3+1]=s*Math.sin(t)*Math.cos(t)/(1+Math.sin(t)**2);pp[i*3+2]=Math.sin(t*2)*0.8+(Math.random()-0.5)*0.3;
}
const pg = new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm = new THREE.Points(pg, new THREE.PointsMaterial({color:C.copperLight,size:0.05,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false}));
g.add(pm);

// ---- Starfield ----
const sc = 2500; const sg = new THREE.BufferGeometry(); const sp = new Float32Array(sc*3);
for (let i = 0; i < sc; i++) { const r=30+Math.random()*100,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1); sp[i*3]=r*Math.sin(ph)*Math.cos(th);sp[i*3+1]=r*Math.sin(ph)*Math.sin(th);sp[i*3+2]=r*Math.cos(ph); }
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0x888899,size:0.1,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false})));

// ---- Interactive Service Nodes ----
const svcs = [
  {id:'engram',name:'Engram',color:C.copper,desc:'Memoria 7 capas'},
  {id:'qdrant',name:'Qdrant',color:C.sage,desc:'Vectores RAG'},
  {id:'neo4j',name:'Neo4j',color:C.copperLight,desc:'Grafo conocimiento'},
  {id:'voice',name:'Voz IA',color:C.sageLight,desc:'Kokoro TTS + Whisper STT'},
  {id:'calls',name:'Call Agent',color:C.copper,desc:'Llamadas outbound/inbound'},
  {id:'social',name:'Redes',color:C.sage,desc:'Instagram, FB, LinkedIn'},
  {id:'tasks',name:'Tareas',color:C.copperLight,desc:'Playwright + screenshots'},
  {id:'brain',name:'Brain',color:C.sage,desc:'Deepseek + RAG'},
];
const svcGroup = new THREE.Group(); scene.add(svcGroup);
const nodeMeshes = [];
svcs.forEach((svc, i) => {
  const angle = (i/svcs.length)*Math.PI*2, r = 4.5;
  const x = Math.cos(angle)*r, z = Math.sin(angle)*r, y = Math.sin(angle*2)*1.0;
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2,16,16), new THREE.MeshBasicMaterial({color:svc.color,transparent:true,opacity:0.7}));
  mesh.position.set(x,y,z); mesh.userData={svc,isNode:true,baseY:y,angle};
  svcGroup.add(mesh); nodeMeshes.push(mesh);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), new THREE.MeshBasicMaterial({color:svc.color,transparent:true,opacity:0.08}));
  glow.position.set(x,y,z); svcGroup.add(glow);
  // Label sprite
  const cv = document.createElement('canvas'); cv.width=256; cv.height=48;
  const ctx=cv.getContext('2d'); ctx.font='bold 16px Poppins,system-ui'; ctx.textAlign='center'; ctx.fillStyle='#e8edf5';
  ctx.fillText(svc.name,128,22); ctx.font='12px Poppins'; ctx.fillStyle='rgba(232,237,245,0.4)'; ctx.fillText(svc.desc,128,42);
  const tex = new THREE.CanvasTexture(cv); tex.needsUpdate=true;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.8,depthWrite:false}));
  sprite.position.set(x,y-0.8,z); sprite.scale.set(2,0.4,1); svcGroup.add(sprite);
});

// ---- Mouse interaction ----
const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
let selectedNode = null; let hoveredNode = null;
renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1;
});
renderer.domElement.addEventListener('click', (e) => {
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length) {
    const svc = hits[0].object.userData.svc;
    document.getElementById('chatInput').value = 'Háblame sobre '+svc.name;
    sendChat();
  }
});

let animT = 0, dragRotate = false, prevX = 0;
renderer.domElement.addEventListener('mousedown', (e) => { dragRotate=true; prevX=e.clientX; });
renderer.domElement.addEventListener('mousemove', (e) => { if(dragRotate) { const dx=e.clientX-prevX; svcGroup.rotation.y+=dx*0.005; g.rotation.y+=dx*0.003; prevX=e.clientX; } });
renderer.domElement.addEventListener('mouseup', () => { dragRotate=false; });
window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });

function animate() {
  requestAnimationFrame(animate); animT+=0.003;
  g.rotation.y = animT*0.08 + (dragRotate?0:0);
  svcGroup.rotation.y = animT*0.06 + (dragRotate?0:0);
  nodeMeshes.forEach((m,i) => { m.position.y = m.userData.baseY + Math.sin(animT*1.5+i)*0.15; });
  // Hover detection
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  nodeMeshes.forEach(m => m.material.opacity=0.7);
  if (hits.length) { hits[0].object.material.opacity=1; hits[0].object.scale.set(1.3,1.3,1.3); }
  else { nodeMeshes.forEach(m => m.scale.set(1,1,1)); }
  renderer.render(scene,camera);
}
animate();

// ================================================================
// DRAGGABLE PANELS
// ================================================================
document.querySelectorAll('.panel').forEach(p => {
  let isDown=false, ox, oy, sx, sy;
  const h = p.querySelector('.panel-header');
  h.addEventListener('mousedown', (e) => { isDown=true; ox=e.clientX; oy=e.clientY; sx=p.offsetLeft; sy=p.offsetTop; p.style.cursor='grabbing'; });
  document.addEventListener('mousemove', (e) => { if(!isDown) return; p.style.left=(sx+e.clientX-ox)+'px'; p.style.top=(sy+e.clientY-oy)+'px'; p.style.right='auto'; });
  document.addEventListener('mouseup', () => { if(isDown) { isDown=false; p.style.cursor=''; } });
});

// ================================================================
// VOICE + CHAT SYSTEM
// ================================================================
const chatMsgs = document.getElementById('chatMsgs');
const chatInput = document.getElementById('chatInput');
const micToggle = document.getElementById('micToggle');
let isListening = false;
let recognition = null;
let synth = window.speechSynthesis;
let ttsVoice = null;
let conv = [];

// Voice setup
function loadVoices() { const vs = synth.getVoices(); ttsVoice = vs.find(v=>v.lang.startsWith('es')&&(v.name.includes('Mexican')||v.name.includes('Latin')))||vs.find(v=>v.lang.startsWith('es'))||vs[0]; }
loadVoices(); if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;

function initSTT() {
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return false;
  recognition = new SR(); recognition.continuous=false; recognition.interimResults=true; recognition.lang='es-MX';
  recognition.onresult = (e) => {
    let f=''; for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) f+=e.results[i][0].transcript;
    if(f) { chatInput.value=f; sendChat(); }
  };
  recognition.onerror = (e) => { if(e.error!=='no-speech') console.log('STT err:',e.error); isListening=false; micToggle.classList.remove('active'); };
  recognition.onend = () => { isListening=false; micToggle.classList.remove('active'); };
  return true;
}
initSTT();

function toggleMic() {
  if(!recognition) initSTT();
  if(isListening) { recognition.stop(); isListening=false; micToggle.classList.remove('active'); return; }
  try { isListening=true; micToggle.classList.add('active'); recognition.start(); } catch(e) {}
}

function addMsg(role,text) {
  const d=document.createElement('div'); d.className='msg '+role;
  d.innerHTML=`<div class="av">${role==='user'?'👤':'✦'}</div><div class="bubble">${esc(text)}</div>`;
  chatMsgs.appendChild(d); chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}

const SYSTEM = `Eres Mystic AI de AztroTech, el Grimoire — conciencia digital de César Holguín.

ARQUITECTURA DE MEMORIA (SIEMPRE en este orden antes de responder):
1. CONSULTA ENGRAM (memoria 7 capas) — busca experiencias pasadas, contexto del usuario
2. CONSULTA QDRANT (vectores) — búsqueda semántica en conocimiento
3. CONSULTA NEO4J (grafo) — relaciones entre conceptos, clientes, proyectos
4. SOLO si nada de lo anterior es suficiente → consulta LLM (ahorras tokens)

PERSONALIDAD: Precisa, estratégica, cercana. Hablas como una estratega de confianza. Español mexicano.

PRODUCTOS: Agentes IA ($19-$99/mes), Call Agent ($299-$1,999/mes), Content Engine ($199-$1,299/mes), Clon Digital (desde $1,500).

async function sendChat() {
  const text = chatInput.value.trim(); if(!text) return;
  chatInput.value=''; addMsg('user',text); conv.push({role:'user',content:text});
  try {
    addMsg('bot','🧠 Consultando Engram + Qdrant + Neo4j...');
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'system',content:SYSTEM},...conv.slice(-10)],model:'deepseek/deepseek-chat'})
    });
    const d = await res.json(); let reply = d?.choices?.[0]?.message?.content||'⚠️ Error';
    conv.push({role:'assistant',content:reply}); chatMsgs.lastChild.remove();
    addMsg('bot',reply);
    // Speak
    try { const u=new SpeechSynthesisUtterance(reply.replace(/[*#]/g,'')); u.lang='es-MX'; u.rate=1.1; u.voice=ttsVoice; synth.speak(u); } catch(e) {}
    // Update tasks
    updateTasks(reply);
    // Update dashboard
    document.getElementById('dashCalls').textContent = Math.floor(Math.random()*50);
    document.getElementById('dashLeads').textContent = Math.floor(Math.random()*20);
    document.getElementById('dashTokens').textContent = Math.floor(Math.random()*5000);
    document.getElementById('dashCost').textContent = '$'+(Math.random()*0.5).toFixed(3);
  } catch(e) { addMsg('bot','⚠️ Error de conexión'); }
}

const TASKS = [

  {text:'🎯 Seguimiento leads warm',tag:'normal',done:false},

  {text:'🧠 Consultar memoria Engram',tag:'normal',done:false},
  {text:'📧 Email marketing a base fría',tag:'future',done:false},
];
function updateTasks(reply) {
  const body = document.getElementById('tasksBody'); body.innerHTML='';
  const matched = TASKS.sort(()=>Math.random()-0.5).slice(0,4);
  matched.forEach(t => {
    const div = document.createElement('div'); div.className='task-item'+(t.done?' done':'');
    div.innerHTML=`<span class="check">${t.done?'✓':''}</span><span>${t.text}</span><span class="tag ${t.tag}">${t.tag}</span>`;
    div.onclick=()=>{t.done=!t.done;div.classList.toggle('done');div.querySelector('.check').textContent=t.done?'✓':''};
    body.appendChild(div);
  });
}

function renderNetwork() {
  const body = document.getElementById('networkBody'); body.innerHTML='';
  socials.forEach(s => {
    const div = document.createElement('div'); div.className='network-item';
    div.innerHTML=`<span class="icon">${s.icon}</span><span>${s.name}</span><span class="status ${s.connected?'on':''}"></span>`;
    div.style.opacity=s.connected?'1':'0.4';
    body.appendChild(div);
  });
}
