<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AztroTech AI — Asistente Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== BRANDBOOK AZTROTECH =====
   Colores: Cobre #AC6D3E · Verde Sage #B6C08B
   Tipografía: Poppins
   Estilo: Oscuro con acentos vibrantes
   ================================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --copper:#AC6D3E;
  --copper-light:#CD8D5D;
  --sage:#B6C08B;
  --sage-light:#D0D8AE;
  --bg-primary:#0a0e17;
  --bg-secondary:#111827;
  --bg-card:rgba(17,23,40,0.8);
  --text-primary:#e8edf5;
  --text-secondary:rgba(232,237,245,0.6);
  --text-muted:rgba(232,237,245,0.3);
  --border:rgba(172,109,62,0.15);
  --radius:12px;
  --shadow:0 4px 24px rgba(0,0,0,0.3);
}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 24px;
  border-bottom:1px solid var(--border);
  background:var(--bg-secondary);
  position:sticky;
  top:0;
  z-index:100;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--copper);
  box-shadow:0 0 16px var(--copper);
}
.brand h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:1px}
.brand .light{font-weight:300;color:var(--copper-light)}
.brand .sub{font-size:10px;color:var(--text-muted);letter-spacing:1px;margin-top:-2px}
.header-status{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-muted);
}
.status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block}
/* ===== MAIN CHAT ===== */
.chat-container{
  flex:1;
  display:flex;
  flex-direction:column;
  max-width:800px;
  margin:0 auto;
  width:100%;
  padding:16px;
}
.messages{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:16px 0;
  scroll-behavior:smooth;
}
.messages:empty::after{
  content:'✨ Escribe algo para comenzar. Soy tu asistente AztroTech.';
  display:block;
  text-align:center;
  color:var(--text-muted);
  font-size:14px;
  padding:60px 20px;
  font-weight:300;
}
/* ===== MESSAGE BUBBLES ===== */
.msg{
  display:flex;
  gap:10px;
  max-width:85%;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg.bot{margin-right:auto}
.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.msg.user .msg-avatar{background:var(--copper);color:#fff}
.msg.bot .msg-avatar{background:var(--sage);color:var(--bg-primary);font-weight:700}
.msg-content{
  padding:12px 16px;
  border-radius:var(--radius);
  font-size:14px;
  line-height:1.6;
  word-wrap:break-word;
}
.msg.user .msg-content{
  background:var(--copper);
  color:#fff;
  border-bottom-right-radius:4px;
}
.msg.bot .msg-content{
  background:var(--bg-card);
  border:1px solid var(--border);
  color:var(--text-primary);
  border-bottom-left-radius:4px;
}
.msg-content p{margin-bottom:8px}
.msg-content p:last-child{margin-bottom:0}
.msg-content strong{color:var(--copper-light)}
.msg-time{
  font-size:10px;
  color:var(--text-muted);
  margin-top:4px;
}
.msg.user .msg-time{text-align:right}
/* ===== TYPING INDICATOR ===== */
.typing{
  display:none;
  align-items:center;
  gap:10px;
  padding:8px 0;
  margin-right:auto;
}
.typing.active{display:flex}
.typing-dots{
  display:flex;gap:4px;
  padding:12px 16px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  border-bottom-left-radius:4px;
}
.typing-dots span{
  width:8px;height:8px;border-radius:50%;
  background:var(--copper-light);
  animation:bounce 1.4s infinite ease-in-out both;
}
.typing-dots span:nth-child(1){animation-delay:-0.32s}
.typing-dots span:nth-child(2){animation-delay:-0.16s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
/* ===== INPUT ===== */
.input-area{
  display:flex;
  gap:8px;
  padding:12px;
  background:var(--bg-secondary);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-top:8px;
}
.input-area textarea{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text-primary);
  font-family:'Poppins',sans-serif;
  font-size:14px;
  resize:none;
  outline:none;
  padding:4px 0;
  min-height:24px;
  max-height:120px;
  line-height:1.5;
}
.input-area textarea::placeholder{color:var(--text-muted)}
.btn-send{
  width:40px;height:40px;border-radius:50%;
  border:none;
  background:var(--copper);
  color:#fff;
  font-size:18px;
  cursor:pointer;
  transition:0.2s;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn-send:hover{background:var(--copper-light);transform:scale(1.05)}
.btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none}
/* ===== SUGGESTIONS ===== */
.suggestions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:8px 0;
}
.suggestion-chip{
  padding:6px 14px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--bg-card);
  color:var(--text-secondary);
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
  font-family:'Poppins',sans-serif;
}
.suggestion-chip:hover{
  border-color:var(--copper);
  color:var(--copper-light);
  background:rgba(172,109,62,0.1);
}
/* ===== FOOTER ===== */
.footer{
  text-align:center;
  padding:12px;
  font-size:10px;
  color:var(--text-muted);
  border-top:1px solid var(--border);
  letter-spacing:1px;
}
.footer span{color:var(--copper-light)}
/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .header{padding:10px 16px}
  .brand h1{font-size:15px}
  .chat-container{padding:8px}
  .msg{max-width:92%}
  .msg-content{font-size:13px;padding:10px 12px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="brand">
    <div class="brand-dot"></div>
    <div>
      <h1>AztroTech <span class="light">AI</span></h1>
      <div class="sub">Asistente Inteligente</div>
    </div>
  </div>
  <div class="header-status">
    <span class="status-dot"></span>
    En línea
  </div>
</div>

<!-- CHAT -->
<div class="chat-container">
  <div class="suggestions" id="suggestions">
    <div class="suggestion-chip" onclick="sendSuggestion('¿Qué es AztroTech?')">¿Qué es AztroTech?</div>
    <div class="suggestion-chip" onclick="sendSuggestion('¿Qué agentes IA ofrecen?')">Agentes IA</div>
    <div class="suggestion-chip" onclick="sendSuggestion('Quiero una cotización')">Cotización</div>
    <div class="suggestion-chip" onclick="sendSuggestion('¿Cómo contacto a César?')">Contacto</div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing">
    <div class="typing-dots"><span></span><span></span><span></span></div>
  </div>
  <div class="input-area">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje..." onkeydown="handleKey(event)"></textarea>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<div class="footer">✦ <span>AztroTech</span> — Espiritualidad con Estructura</div>

<script>
const API_URL = window.location.origin + '/api/chat';
const TENANT = 'astrotech';
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const typing = document.getElementById('typing');

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '👤' : '✦';
  const time = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-content">${marked(text)}</div>
      <div class="msg-time">${time}</div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function marked(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}

function sendSuggestion(text) {
  input.value = text;
  sendMessage();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', text);
  typing.classList.add('active');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: [
          {role:'system', content:'Eres el asistente IA de AztroTech, una firma de innovación responsable fundada por César Holguín. Respondes en español, con tono preciso, estratégico y cercano. Tus productos: agentes IA (Starter $19/mes, Pro $49/mes, Enterprise $99/mes), Call Agent ($299-$1,999/mes), Content Engine ($199-$1,299/mes), Clon Digital (desde $1,500). Hablas como un estratega de confianza.'},
          {role:'user', content: text}
        ],
        model: 'deepseek/deepseek-chat'
      })
    });
    const data = await res.json();
    const reply = data?.choices?.[0]?.message?.content || 'Lo siento, no pude procesar tu consulta.';
    addMessage('bot', reply);
  } catch(e) {
    addMessage('bot', '⚠️ Error de conexión. Intenta de nuevo.');
  } finally {
    typing.classList.remove('active');
    sendBtn.disabled = false;
    input.focus();
  }
}
</script>
</body>
</html>
