# Router de dominios — Sonora Digital Corp
# Para VPS 149.56.46.173

# ===== WILDCARD SSL (ejecutar primero) =====
# certbot certonly --manual --preferred-challenges dns \
#   -d sonoradigitalcorp.com -d "*.sonoradigitalcorp.com" \
#   -d aztrotech.mx -d "*.aztrotech.mx"
#
# Luego agregar TXT _acme-challenge en el DNS de cada dominio

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ===== SONORA DIGITAL CORP =====
    server_name sonoradigitalcorp.com www.sonoradigitalcorp.com;

    ssl_certificate /etc/letsencrypt/live/sonoradigitalcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonoradigitalcorp.com/privkey.pem;

    location / {
        root /var/www/sonoradigitalcorp;
        index index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ===== WILDCARD CLIENTES =====
# *.sonoradigitalcorp.com → auto por subdominio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name *.sonoradigitalcorp.com;

    ssl_certificate /etc/letsencrypt/live/sonoradigitalcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonoradigitalcorp.com/privkey.pem;

    location / {
        proxy_pass http://localhost:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ===== ASTROTECH (César) =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name aztrotech.mx www.aztrotech.mx;

    ssl_certificate /etc/letsencrypt/live/aztrotech.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aztrotech.mx/privkey.pem;

    location / {
        proxy_pass http://localhost:8767;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ===== SERVICIOS INTERNOS (protegidos) =====
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name admin.sonoradigitalcorp.com;

    ssl_certificate /etc/letsencrypt/live/sonoradigitalcorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonoradigitalcorp.com/privkey.pem;

    auth_basic "Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /openclaw/ {
        proxy_pass http://localhost:18789/;
    }

    location /qdrant/ {
        proxy_pass http://localhost:6333/;
    }

    location /neo4j/ {
        proxy_pass http://localhost:7687/;
    }

    location /n8n/ {
        proxy_pass http://localhost:5678/;
    }
}

# ===== REDIRECT HTTP → HTTPS =====
server {
    listen 80;
    listen [::]:80;
    server_name sonoradigitalcorp.com *.sonoradigitalcorp.com aztrotech.mx *.aztrotech.mx;
    return 301 https://$host$request_uri;
}
