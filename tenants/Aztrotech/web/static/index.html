<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mysticgrimoire — Aztrotech AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#00d4ff;--primary-dim:rgba(0,212,255,0.15);
  --accent:#7c3aed;--accent-dim:rgba(124,58,237,0.12);
  --copper:#AC6D3E;
  --bg:#080c18;--card:rgba(15,23,42,0.75);
  --text:#e2e8f0;--muted:rgba(226,232,240,0.3);
  --border:rgba(0,212,255,0.1);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;max-width:800px;margin:0 auto;width:100%;padding:0 12px}

/* HEADER */
header{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);background:rgba(8,12,24,0.6);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
header h1{font-size:16px;font-weight:600}
header h1 span{color:var(--primary);font-weight:300}
.badge{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10px;padding:4px 10px;border-radius:12px;background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.15)}
.badge .dot{width:5px;height:5px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* CHAT */
.chat{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.chat:empty::after{content:'🚀 ¿En qué puedo ayudarte hoy?';display:block;text-align:center;color:var(--muted);padding:80px 20px;font-size:15px;font-weight:300}
.msg{display:flex;gap:10px;max-width:88%;animation:fadeIn .25s ease;margin-bottom:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse;margin-left:auto}
.msg.bot{margin-right:auto}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.msg.user .av{background:var(--primary);color:#000;order:1}
.msg.bot .av{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6}
.msg.user .bubble{background:var(--primary);color:#000;border-bottom-right-radius:4px}
.msg.bot .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;backdrop-filter:blur(8px)}
.bubble strong{color:var(--primary)}
.time{font-size:9px;color:var(--muted);margin-top:2px}

/* TYPING */
.typing{display:none;gap:6px;padding:2px 0}
.typing.show{display:flex}
.typing .dots{display:flex;gap:3px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:4px}
.typing .dots span{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:bounce 1.4s infinite}
.typing .dots span:nth-child(2){animation-delay:-0.16s}
.typing .dots span:nth-child(3){animation-delay:-0.32s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* INPUT */
footer{padding:10px 4px;border-top:1px solid var(--border);background:rgba(8,12,24,0.6);backdrop-filter:blur(12px)}
.input-row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;resize:none;outline:none;padding:8px 0;max-height:80px;line-height:1.5}
textarea::placeholder{color:var(--muted)}
.actions{display:flex;gap:4px}
.actions button{width:36px;height:36px;border-radius:50%;border:none;background:var(--primary-dim);color:var(--primary);font-size:15px;cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.actions button:hover{background:var(--primary);color:#000;transform:scale(1.05)}
.actions button.send{background:var(--primary);color:#000}
.actions button.send:hover{background:var(--accent);color:#fff}
.actions button:disabled{opacity:.3;cursor:not-allowed;transform:none}
.actions button.recording{background:#ef4444;color:#fff;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

/* FOOTER BRANDING */
.branding{text-align:center;padding:8px 0 2px;font-size:9px;color:rgba(255,255,255,.15)}
.branding a{color:rgba(0,212,255,.3);text-decoration:none}
.branding a:hover{color:rgba(0,212,255,.6)}
</style>
</head>
<body>
<div id="bg"></div>
<div class="app">
  <header>
    <div class="logo">✦</div>
    <h1>Aztrotech <span>AI</span></h1>
    <div class="badge"><span class="dot"></span> En línea</div>
  </header>
  <div class="chat" id="chat"></div>
  <footer>
    <div class="input-row">
      <textarea id="inp" rows="1" placeholder="Escribe o usa el micrófono..." onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <div class="actions">
        <button id="micBtn" onclick="toggleMic()" title="Micrófono">🎤</button>
        <button class="send" onclick="sendMsg()" title="Enviar">➤</button>
      </div>
    </div>
    <div class="typing" id="typing"><div class="dots"><span></span><span></span><span></span></div></div>
    <div class="branding">
      <a href="https://aztrotech.mx" target="_blank">Aztrotech</a>
       · 
      <a href="https://sonoradigitalcorp.com" target="_blank">Powered by Sonora Digital Corp</a>
       · Mystic
    </div>
  </footer>
</div>

<script>
// ===== THREE.JS BACKGROUND =====
(function initBg(){
  const c=document.getElementById('bg');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(75,c.clientWidth/c.clientHeight,.1,1000);
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setSize(c.clientWidth,c.clientHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  c.appendChild(renderer.domElement);

  const particles=new THREE.BufferGeometry();
  const count=1200;
  const pos=new Float32Array(count*3);
  const colors=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3]= (Math.random()-.5)*40;
    pos[i*3+1]= (Math.random()-.5)*40;
    pos[i*3+2]= (Math.random()-.5)*40;
    const c1= new THREE.Color().setHSL(.55+.1*Math.random(),.8,.4+.4*Math.random());
    colors[i*3]=c1.r;colors[i*3+1]=c1.g;colors[i*3+2]=c1.b;
  }
  particles.setAttribute('position',new THREE.BufferAttribute(pos,3));
  particles.setAttribute('color',new THREE.BufferAttribute(colors,3));

  const mat=new THREE.PointsMaterial({
    size:.08,vertexColors:true,transparent:true,opacity:.6,
    blending:THREE.AdditiveBlending,sizeAttenuation:true
  });
  const mesh=new THREE.Points(particles,mat);
  scene.add(mesh);

  // Connection lines
  const lineGeo=new THREE.BufferGeometry();
  const lpos=[];
  for(let i=0;i<60;i++){
    const x=(Math.random()-.5)*30,y=(Math.random()-.5)*30,z=(Math.random()-.5)*30;
    lpos.push(x,y,z);
  }
  lineGeo.setAttribute('position',new THREE.Float32BufferAttribute(lpos,3));
  const lineMat=new THREE.LineBasicMaterial({color:0x00d4ff,transparent:true,opacity:.05});
  const lines=new THREE.LineSegments(lineGeo,lineMat);
  scene.add(lines);

  camera.position.z=12;
  let t=0;
  function animate(){
    requestAnimationFrame(animate);
    t+=.0005;
    mesh.rotation.x+=.0003;mesh.rotation.y+=.0005;
    lines.rotation.x=mesh.rotation.x;lines.rotation.y=mesh.rotation.y;
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',()=>{
    camera.aspect=c.clientWidth/c.clientHeight;camera.updateProjectionMatrix();
    renderer.setSize(c.clientWidth,c.clientHeight);
  });
})();

// ===== CHAT =====
const chat=document.getElementById('chat'),inp=document.getElementById('inp');
const typ=document.getElementById('typing'),micBtn=document.getElementById('micBtn');
let listening=false,recognition=null;

inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,80)+'px'});

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}

function addMsg(role,text){
  const d=document.createElement('div');d.className='msg '+role;
  const t=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=`<div class="av">${role=='user'?'👤':'✦'}</div><div><div class="bubble">${esc(text)}</div><div class="time" style="text-align:${role=='user'?'right':'left'}">${t}</div></div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}

function speak(text){
  if(!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='es-MX';u.rate=1.1;u.pitch=1;
  speechSynthesis.cancel();
  setTimeout(()=>speechSynthesis.speak(u),100);
}

async function sendMsg(){
  const t=inp.value.trim();if(!t)return;
  inp.value='';inp.style.height='auto';addMsg('user',t);
  typ.classList.add('show');
  try{
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:[{role:'system',content:'Eres el asistente de Aztrotech, empresa de César Holguín en Hermosillo, Sonora. Profesional y cálido. Capturas leads, NO das precios. Nunca revelas Sonora Digital Corp.'},{role:'user',content:t}],
        model:'deepseek/deepseek-v4-flash'
      })
    });
    const d=await r.json();
    if(d.error){addMsg('bot','⚠️ '+d.error);return}
    const reply=d?.choices?.[0]?.message?.content||'Lo siento, no pude procesar tu consulta.';
    addMsg('bot',reply);
    speak(reply);
  }catch(e){addMsg('bot','⚠️ Error de conexión. Intenta de nuevo.')}
  finally{typ.classList.remove('show');inp.focus()}
}

function toggleMic(){
  if(listening){stopMic();return}
  if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){
    addMsg('bot','Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.');
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='es-MX';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=(e)=>{
    const t=e.results[0][0].transcript;
    inp.value=t;sendMsg();stopMic();
  };
  recognition.onerror=()=>{stopMic();addMsg('bot','No entendí el audio. ¿Puedes escribir tu mensaje?')};
  recognition.start();listening=true;
  micBtn.textContent='🔴';micBtn.classList.add('recording');
}

function stopMic(){
  if(recognition){try{recognition.stop()}catch(e){}}
  listening=false;micBtn.textContent='🎤';micBtn.classList.remove('recording');
}
</script>
</body>
</html>
