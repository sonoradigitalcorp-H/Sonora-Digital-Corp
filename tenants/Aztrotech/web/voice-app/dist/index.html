<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Aztrotech — Asistente de César</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--card:rgba(255,255,255,0.03);--primary:#00d4ff;--accent:#7c3aed;--success:#22c55e;--text:#fafafa;--muted:rgba(255,255,255,0.45);--dim:rgba(255,255,255,0.06)}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden}
.ambient .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5}
.ambient .orb-1{width:600px;height:600px;top:-200px;left:-100px;background:radial-gradient(circle,rgba(0,212,255,.12),transparent 70%);animation:drift1 25s ease-in-out infinite}
.ambient .orb-2{width:500px;height:500px;bottom:-150px;right:-100px;background:radial-gradient(circle,rgba(124,58,237,.08),transparent 70%);animation:drift2 30s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-40px)}}
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--dim);backdrop-filter:blur(20px);background:rgba(9,9,11,.8)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 0 20px rgba(0,212,255,.3)}
.logo-text{font-size:16px;font-weight:700;letter-spacing:-.5px}.logo-text span{color:var(--primary);font-weight:300}
.hdr-links{display:flex;gap:6px}
.hdr-links a{padding:6px 12px;border-radius:8px;background:var(--dim);color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;border:1px solid var(--dim);transition:all .2s}
.hdr-links a:hover{background:var(--primary);color:#000;border-color:var(--primary)}
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.orb-wrap{display:flex;justify-content:center;padding:16px 0}
.orb-container{position:relative;cursor:pointer}
.orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(0,212,255,.5),rgba(124,58,237,.25),rgba(0,0,0,.9));box-shadow:0 0 50px rgba(0,212,255,.25);transition:all .4s;animation:float 5s ease-in-out infinite}
.orb:hover{box-shadow:0 0 70px rgba(0,212,255,.4);transform:scale(1.04)}
.orb.active{box-shadow:0 0 80px rgba(0,212,255,.5);animation:pulse 1.5s ease-in-out infinite}
.orb.speaking{box-shadow:0 0 100px rgba(0,212,255,.6);animation:speak .2s ease-in-out infinite alternate}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes speak{0%{transform:scale(1)}100%{transform:scale(1.03)}}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(0,212,255,.08);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.orb-label{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}.orb-label b{color:var(--primary)}
.card{background:var(--card);border:1px solid var(--dim);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:all .3s}
.card:hover{border-color:rgba(0,212,255,.1)}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time-slot{padding:10px;border-radius:10px;background:var(--dim);border:1px solid transparent;text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--muted)}
.time-slot:hover{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.15);color:var(--text)}
.time-slot.selected{background:var(--primary);color:#000;border-color:var(--primary)}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.5;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.bot{background:var(--card);border:1px solid var(--dim);align-self:flex-start;border-bottom-left-radius:4px;backdrop-filter:blur(10px)}
.msg.user{background:var(--primary);color:#000;align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.msg .ts{font-size:9px;opacity:.35;margin-top:4px;display:block}
.input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--dim);background:rgba(9,9,11,.9);backdrop-filter:blur(20px)}
.input-bar input{flex:1;padding:12px 16px;border-radius:12px;border:1px solid var(--dim);background:rgba(255,255,255,.02);color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:all .2s;backdrop-filter:blur(10px)}
.input-bar input:focus{border-color:rgba(0,212,255,.2)}
.input-bar input::placeholder{color:rgba(255,255,255,.25)}
.btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--dim);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn:hover{background:var(--dim);color:var(--text)}
.btn.primary{background:var(--primary);color:#000;border-color:var(--primary)}
.btn.recording{background:#ef4444;color:#fff;border-color:#ef4444;animation:recPulse 1.2s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
.social-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.social-btn{padding:8px 16px;border-radius:10px;font-size:11px;font-weight:500;text-decoration:none;display:flex;align-items:center;gap:6px;border:1px solid var(--dim);background:var(--card);transition:all .2s}
.social-btn:hover{transform:scale(1.05)}
.social-btn.wa{color:#25D366;border-color:rgba(37,211,102,.2)}
.period-btns{display:flex;gap:8px;margin-bottom:16px}
.period-btn{flex:1;padding:10px;border-radius:10px;background:var(--dim);border:1px solid transparent;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;text-align:center}
.period-btn.active{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.2);color:var(--primary)}
@media(max-width:600px){.hdr-links{display:none}.time-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="app">
  <div class="hdr">
    <div class="logo"><div class="logo-mark">A</div><div class="logo-text">Aztrotech <span>AI</span></div></div>
    <div class="hdr-links">
      <a href="https://wa.me/5216621072254" target="_blank">📱 WhatsApp</a>
      <a href="https://instagram.com/cesarholguin" target="_blank">📸 Instagram</a>
      <a href="https://linkedin.com/in/cesarholguin" target="_blank">💼 LinkedIn</a>
      <a href="https://aztrotech.mx" target="_blank">🌐 Web</a>
    </div>
  </div>
  <div class="content" id="content">
    <div class="orb-wrap">
      <div class="orb-container">
        <div class="ring" style="width:140px;height:140px"></div>
        <div class="ring" style="width:180px;height:180px"></div>
        <div class="orb" id="orb" onclick="toggleMic()"></div>
      </div>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--muted)">Asistente virtual de <b style="color:var(--primary)">César Holguín</b> · Aztrotech</p>

    <div id="scheduleSection" style="display:none">
      <div class="card">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:12px">📅 Agenda de César</h3>
        <p style="font-size:11px;color:var(--muted);margin-bottom:12px">Horarios disponibles (8am - 6pm)</p>
        <div class="period-btns">
          <button class="period-btn active" onclick="filterTimes('all',this)">Todos</button>
          <button class="period-btn" onclick="filterTimes('mor',this)">☀️ Mañana</button>
          <button class="period-btn" onclick="filterTimes('tar',this)">🌙 Tarde</button>
        </div>
        <div class="time-grid" id="timeGrid"></div>
      </div>
    </div>

    <div id="confirmedSection" style="display:none">
      <div class="card" style="text-align:center;padding:28px">
        <div style="font-size:40px;margin-bottom:10px">✅</div>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">¡Cita confirmada!</h3>
        <p id="confirmedMsg" style="font-size:12px;color:var(--muted);margin-bottom:14px"></p>
        <div class="social-row">
          <a id="waLink" href="https://wa.me/5216621072254" target="_blank" class="social-btn wa">📱 WhatsApp con César</a>
        </div>
        <button onclick="goHome()" style="margin-top:14px;padding:8px 18px;border-radius:10px;background:var(--dim);border:1px solid var(--dim);color:var(--muted);font-size:11px;cursor:pointer">🏠 Volver</button>
      </div>
    </div>

    <div id="chat" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
  <div class="input-bar">
    <button class="btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <input id="msgInput" placeholder="Escribe tu mensaje..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendFromInput()}">
    <button class="btn primary" onclick="sendFromInput()">➤</button>
  </div>
</div>
<script>
let isRecording=false,recognition=null;const synth=window.speechSynthesis;
let step=0,lead={tenant_id:'aztrotech',name:'',phone:'',email:'',company:'',service:'',date:'',time:''};
const S={GREET:0,ASK_NAME:1,EXPLAIN:2,ASK_SERVICE:3,ASK_COMPANY:4,ASK_PHONE:5,ASK_EMAIL:6,SCHEDULE:7,PICK_TIME:8,CONFIRM:9,DONE:10};

function addBot(t){const c=document.getElementById('chat');c.innerHTML+=`<div class="msg bot">${t}<span class="ts">${new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</span></div>`;c.scrollTop=c.scrollHeight}
function addUser(t){const c=document.getElementById('chat');c.innerHTML+=`<div class="msg user">${t}<span class="ts">${new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</span></div>`;c.scrollTop=c.scrollHeight}
function speak(text){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,''));u.lang='es-MX';u.rate=1.05;document.getElementById('orb').classList.add('speaking');u.onend=()=>document.getElementById('orb').classList.remove('speaking');synth.speak(u)}

function toggleMic(){if(isRecording){stopMic();return}if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){addBot('Usa Chrome para voz.');return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='es-MX';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=(e)=>{const text=e.results[0][0].transcript;addUser(text);processMsg(text)};recognition.onerror=()=>stopMic();recognition.onend=()=>stopMic();recognition.start();isRecording=true;document.getElementById('micBtn').classList.add('recording');document.getElementById('orb').classList.add('active')}
function stopMic(){if(recognition)try{recognition.stop()}catch(e){}isRecording=false;document.getElementById('micBtn').classList.remove('recording');document.getElementById('orb').classList.remove('active')}
function sendFromInput(){const i=document.getElementById('msgInput');const t=i.value.trim();if(!t)return;i.value='';addUser(t);processMsg(t)}

function processMsg(text){
  const t=text.toLowerCase();
  
  if(step===S.ASK_NAME){
    addUser(text);
    lead.name=text.trim().split(' ')[0];
    addBot("Mucho gusto, "+lead.name+". Soy el asistente virtual de César Holguín, fundador de Aztrotech. Nos dedicamos a automatizar negocios con inteligencia artificial. ¿Qué tipo de negocio tienes, "+lead.name+"?");
    speak("Mucho gusto, "+lead.name+". ¿Qué tipo de negocio tienes?");
    step=S.ASK_COMPANY;return;
  }
  
  if(step===S.ASK_COMPANY){
    addUser(text);
    lead.company=text.trim();
    addBot("Excelente, "+lead.name+". En Aztrotech construimos soluciones a la medida: agentes IA que atienden a tus clientes 24/7 por WhatsApp, Instagram y Facebook; sistemas de ventas automáticos; y software personalizado para tu operación. ¿Qué te gustaría automatizar en "+lead.company+"?");
    speak("¿Qué te gustaría automatizar?");
    step=S.ASK_SERVICE;return;
  }
  
  if(step===S.ASK_SERVICE){
    addUser(text);
    lead.service=text.trim();
    addBot("Perfecto, "+lead.name+". Podemos diseñar exactamente lo que necesitas. César ofrece una llamada gratuita de 15 minutos para entender tu negocio y proponerte la mejor solución. ¿Te gustaría agendar esa llamada?");
    speak("¿Te gustaría agendar una llamada con César?");
    step=S.SCHEDULE;return;
  }
  
  if(step===S.SCHEDULE){
    addUser(text);
    if(t.includes('sí')||t.includes('si')||t.includes('agendar')||t.includes('quiero')||t.includes('ok')||t.includes('dale')||t.includes('claro')){
      addBot("Muy bien, "+lead.name+". ¿Mañana o tarde te queda mejor?");
      speak("¿Mañana o tarde?");
      step=S.PICK_TIME;showSchedule('all');return;
    } else {
      addBot("Sin problema, "+lead.name+". Cuando quieras, aquí estoy para ayudarte. ¿Tienes alguna otra pregunta?");
      step=S.EXPLAIN;return;
    }
  }
  
  if(step===S.PICK_TIME){
    addUser(text);
    let filter='all';
    if(t.includes('mañana')||t.includes('manana'))filter='mor';
    else if(t.includes('tarde'))filter='tar';
    renderTimes(getDefaultSlots(),filter);
    addBot("Selecciona el horario que prefieras, "+lead.name);
    speak("Selecciona el horario");
    step=S.ASK_PHONE;return;
  }
  
  if(step===S.ASK_PHONE && lead.time){
    addUser(text);
    addBot("Gracias, "+lead.name+". ¿Tu número de WhatsApp para enviarte la confirmación?");
    speak("¿Tu número de WhatsApp?");
    step=S.ASK_EMAIL;return;
  }
  
  if(step===S.ASK_EMAIL){
    addUser(text);
    lead.phone=text.replace(/\D/g,'').trim();
    addBot("¿Tu email, "+lead.name+"?");
    speak("¿Tu email?");
    step=S.CONFIRM;return;
  }
  
  if(step===S.CONFIRM){
    addUser(text);
    lead.email=text.trim();
    bookingDate=new Date(Date.now()+86400000).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    addBot(lead.name+", para confirmar: tu llamada con César es el "+bookingDate+" a las "+lead.time+". Empresa: "+lead.company+". Servicio: "+lead.service+". ¿Confirmas?");
    speak("¿Confirmas tu llamada?");
    step=S.DONE;return;
  }
  
  if(step===S.DONE){
    if(t.includes('sí')||t.includes('si')||t.includes('confirmo')){
      addUser(text);doConfirm();return;
    }
  }
  
  // AI fallback
  document.getElementById('orb').classList.add('speaking');
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}]})})
    .then(r=>r.json()).then(d=>{const r=d?.choices?.[0]?.message?.content||'¿Puedes repetir?';addBot(r);speak(r)})
    .catch(()=>addBot('Error técnico')).finally(()=>document.getElementById('orb').classList.remove('speaking'));
}

function showSchedule(filter){
  document.getElementById('scheduleSection').style.display='block';
  fetch('/api/availability').then(r=>r.json()).then(d=>{renderTimes(d.slots,filter)}).catch(()=>renderTimes(getDefaultSlots(),filter));
}
function getDefaultSlots(){const s=[];for(let h=8;h<18;h++)for(let m of[0,30]){const t=new Date();t.setHours(h,m);s.push({time:t.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'}),period:h<12?'morning':'afternoon'})}return s}
function renderTimes(slots,filter){const g=document.getElementById('timeGrid');g.innerHTML='';const f=filter==='all'?slots:slots.filter(s=>s.period===(filter==='mor'?'morning':'afternoon'));f.forEach(s=>{const slot=document.createElement('div');slot.className='time-slot';slot.textContent=s.time;slot.onclick=()=>pickTime(s.time,slot);g.appendChild(slot)})}
function filterTimes(f,btn){document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTimes(getDefaultSlots(),f)}
function pickTime(t,el){document.querySelectorAll('.time-slot').forEach(s=>s.classList.remove('selected'));el.classList.add('selected');lead.time=t}

function doConfirm(){
  document.getElementById('scheduleSection').style.display='none';
  lead.date=new Date(Date.now()+86400000).toISOString().split('T')[0];
  
  fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{});
  
  const waText=encodeURIComponent("Hola César, agendé una llamada. Soy "+lead.name+" de "+lead.company+". Servicio: "+lead.service+". Fecha: "+lead.date+" Hora: "+lead.time);
  document.getElementById('waLink').href='https://wa.me/5216621072254?text='+waText;
  
  document.getElementById('confirmedSection').style.display='block';
  document.getElementById('confirmedMsg').textContent=lead.name+', tu llamada con César está agendada para las '+lead.time+'. Te enviamos la confirmación por WhatsApp al '+lead.phone+'.';
  
  addBot("Excelente, "+lead.name+". Tu cita está confirmada. César te enviará un mensaje de WhatsApp al "+lead.phone+" para confirmar los detalles. Si necesitas algo, escríbeme. ¡Hasta pronto!");
  speak("Tu cita está confirmada, "+lead.name+". César te contactará por WhatsApp.");
  step=S.DONE;
}

function goHome(){document.getElementById('scheduleSection').style.display='none';document.getElementById('confirmedSection').style.display='none';document.getElementById('chat').innerHTML='';step=0;lead={tenant_id:'aztrotech',name:'',phone:'',email:'',company:'',service:'',date:'',time:''};startFlow()}

function startFlow(){
  step=S.GREET;
  addBot("Buenas tardes. Soy el asistente virtual de César Holguín, fundador de Aztrotech. Estoy aquí para ayudarte a conocer cómo podemos automatizar tu negocio con inteligencia artificial. ¿Cómo te llamas?");
  speak("Buenas tardes. Soy el asistente de César Holguín. ¿Cómo te llamas?");
  step=S.ASK_NAME;
}

setTimeout(()=>startFlow(),800);
</script>
</body>
</html>
