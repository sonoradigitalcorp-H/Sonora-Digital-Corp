prompt_injection:
  enabled: true
  model: mystic-shield

rate_limits:
  whatsapp: 60/minute
  api_calls: 1000/hour

data_masking:
  pii_detection: true
  auto_redact:
    - credit_card
    - ssn
    - password

tool_sandbox:
  enabled: true
  allowed_domains:
    - "api.${TENANT_DOMAIN}"
  blocked_commands:
    - rm
    - sudo
    - curl
